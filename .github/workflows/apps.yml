# Gera os apps (Windows, Linux, Android e iOS).
# - Em PR que mexe nos apps: os arquivos ficam em "Artifacts" na página da execução, pra testar.
# - Ao criar uma tag v* (ex.: v0.2.0): publica tudo numa Release do GitHub.
# Passo a passo em docs/APPS.md.
name: Apps

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/mobile/**'
      - '.github/workflows/apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win
            files: apps/desktop/release/SimpleCall-Windows.exe
          - name: Linux
            os: ubuntu-latest
            args: --linux
            files: |
              apps/desktop/release/SimpleCall-Linux.AppImage
              apps/desktop/release/SimpleCall-Linux.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versão
        shell: bash
        run: echo "VERSION=$([[ $GITHUB_REF == refs/tags/v* ]] && echo ${GITHUB_REF_NAME#v} || echo 0.0.0-teste.${{ github.run_number }})" >> $GITHUB_ENV
      # Programa nativo que captura só o áudio do jogo (native/win-audio.cpp), com o compilador da Microsoft.
      - name: Compilar captura de áudio (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop/native
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          New-Item -ItemType Directory -Force bin | Out-Null
          @(
            "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`"",
            "cl /nologo /O2 /EHsc /std:c++17 /W4 win-audio.cpp /Fobin\ /Febin\simplecall-audio.exe ole32.lib mmdevapi.lib user32.lib"
          ) | Set-Content -Encoding ascii build.bat
          cmd /c build.bat
          if (!(Test-Path bin\simplecall-audio.exe)) { exit 1 }
      - name: Gerar instalador
        working-directory: apps/desktop
        # bash também no Windows: o PowerShell quebra o argumento -c.extraMetadata.version=...
        shell: bash
        run: pnpm build && pnpm exec electron-builder ${{ matrix.args }} --publish never -c.extraMetadata.version=${{ env.VERSION }}
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @simple-call/mobile exec cap sync android
      - name: Versão
        run: echo "VERSION_NAME=$([[ $GITHUB_REF == refs/tags/v* ]] && echo ${GITHUB_REF_NAME#v} || echo 0.0.0-teste)" >> $GITHUB_ENV
      # Com a chave nos segredos: APK de release assinado (dá pra atualizar por cima).
      # Sem a chave: APK de teste, assinado com uma chave temporária.
      - name: Chave de assinatura
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/simplecall.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/simplecall.jks" >> $GITHUB_ENV
      - name: Gerar APK
        working-directory: apps/mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../SimpleCall-Android.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../SimpleCall-Android.apk
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: apps/mobile/SimpleCall-Android.apk
          if-no-files-found: error

  ios:
    name: iOS (sem assinatura)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @simple-call/mobile exec cap sync ios
      # Sem conta paga da Apple não tem como assinar: sai um .ipa sem assinatura,
      # que dá pra instalar com o Sideloadly/AltStore usando um Apple ID comum (vale 7 dias).
      - name: Compilar
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -version
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../../SimpleCall-iOS-sem-assinatura.ipa Payload
      - uses: actions/upload-artifact@v6
        with:
          name: ios
          path: apps/mobile/SimpleCall-iOS-sem-assinatura.ipa
          if-no-files-found: error

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.desktop.result == 'success'
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## Downloads

            | Sistema | Arquivo |
            | --- | --- |
            | Windows 10/11 | `SimpleCall-Windows.exe` (o Windows pode avisar "protegeu o computador": Mais informações → Executar assim mesmo) |
            | Linux | `SimpleCall-Linux.AppImage` (qualquer distro) ou `SimpleCall-Linux.deb` (Ubuntu, Mint, Debian) |
            | Android | `SimpleCall-Android.apk` (permita instalar de fontes desconhecidas) |
            | iOS | `SimpleCall-iOS-sem-assinatura.ipa` (só com Sideloadly/AltStore, veja docs/APPS.md) |

            Ou use direto no navegador: https://simplecall.antonioinaciodev.workers.dev
