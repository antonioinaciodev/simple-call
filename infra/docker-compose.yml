# Deploy num servidor só (ex.: Oracle Cloud Always Free em São Paulo).
# Rascunho da fase 3: ainda não foi testado num servidor de verdade.
#
#   cp infra/.env.example infra/.env   # e preencha
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
#
# network_mode: host porque o LiveKit usa uma faixa grande de portas UDP,
# e mapear isso pelo Docker deixa a mídia mais lenta.
services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: --config /etc/livekit.yaml --node-ip ${PUBLIC_IP}
    network_mode: host
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      LIVEKIT_URL: wss://${LIVEKIT_DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}

  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
