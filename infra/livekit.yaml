# Configuração do LiveKit para produção. As chaves vêm da variável LIVEKIT_KEYS (docker-compose).
port: 7880
rtc:
  # Mídia por UDP (o caminho rápido) e TCP 7881 como plano B pra redes que bloqueiam UDP.
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: false
turn:
  # TURN embutido pra quem está atrás de NAT/firewall chato.
  enabled: true
  udp_port: 3478
room:
  # Sala vazia some depois de 5 minutos.
  empty_timeout: 300
  departure_timeout: 20
logging:
  level: info
