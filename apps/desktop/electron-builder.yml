# Instaladores do app desktop. Os nomes não têm versão pra que o link
# github.com/.../releases/latest/download/<nome> sempre baixe a última.
appId: dev.antonioinacio.simplecall
productName: Simple Call
copyright: Copyright © 2026 Antonio Inácio
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - offline.html
  - package.json
# Não tem dependência nativa pra recompilar.
npmRebuild: false
nodeGypRebuild: false
asar: true
# Endereço dos links de convite (botão "Abrir no app" do site). O próprio app registra no
# Windows ao abrir (main.ts).
protocols:
  - name: Simple Call
    schemes: [simplecall]
electronLanguages: [pt-BR, en-US]

win:
  target: nsis
  icon: build/icon.png
  # Captura do áudio do jogo, compilada no GitHub Actions (veja native/win-audio.cpp).
  extraResources:
    - from: native/bin/simplecall-audio.exe
      to: simplecall-audio.exe
nsis:
  # Instala só pro usuário, sem pedir administrador, e abre o app no fim.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  shortcutName: Simple Call
  artifactName: SimpleCall-Windows.${ext}

