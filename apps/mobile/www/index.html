<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Simple Call</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; background: #0a0a0a; color: #ededed;
        font: 14px/1.45 Inter, ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 320px; padding: 24px; text-align: center; }
      h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
      p { color: #8a8a8a; margin: 0 0 20px; }
      button {
        font: inherit; padding: 10px 18px; border-radius: 10px; cursor: pointer;
        border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>Não deu pra abrir o Simple Call. Confira a internet e tente de novo.</p>
      <button id="retry" autofocus>Tentar de novo</button>
    </main>
    <script>
      // Página local do app, mostrada quando o site não abre (sem internet).
      const url = 'https://simplecall.antonioinaciodev.workers.dev';
      const retry = () => location.replace(url);
      document.getElementById('retry').onclick = retry;
      // Tenta sozinho quando a internet voltar.
      addEventListener('online', retry);
    </script>
  </body>
</html>
