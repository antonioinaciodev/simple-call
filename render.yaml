# Deploy grátis no Render: o servidor só apresenta as pessoas da call (sinalização);
# áudio e vídeo vão direto entre os navegadores. Passo a passo em docs/DEPLOY.md.
services:
  - type: web
    name: simple-call
    runtime: node
    plan: free
    buildCommand: npx pnpm@10 install --frozen-lockfile && npx pnpm@10 build
    # NODE_ENV só no start: no build ele faria o pnpm pular as devDependencies (vite, tsc).
    startCommand: NODE_ENV=production node apps/server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
