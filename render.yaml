# Deploy grátis no Render (site + API). O áudio e vídeo ficam no LiveKit Cloud.
# Passo a passo em docs/DEPLOY.md, opção "Nuvem grátis".
services:
  - type: web
    name: simple-call
    runtime: node
    plan: free
    buildCommand: npx pnpm@10 install --frozen-lockfile && npx pnpm@10 build
    # NODE_ENV só no start: no build ele faria o pnpm pular as devDependencies (vite, tsc).
    startCommand: NODE_ENV=production node apps/server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Os três valores abaixo vêm do LiveKit Cloud; o Render pede na criação.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
